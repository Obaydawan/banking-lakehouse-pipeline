name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dbt-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Install dbt
        run: pip install dbt-core dbt-duckdb

      - name: Configure dbt profile for CI (DuckDB, local file, no secrets needed)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          transactsafe:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: $GITHUB_WORKSPACE/bronze/bronze.duckdb
                threads: 4
          EOF

      - name: Generate synthetic data
        run: python generate_data.py
        working-directory: data_generator

      - name: Load bronze layer
        run: python load_bronze.py
        working-directory: bronze

      - name: Install dbt packages (if you use any)
        run: dbt deps
        working-directory: dbt_project/transactsafe
        continue-on-error: true

      - name: Run models
        run: dbt run
        working-directory: dbt_project/transactsafe

      - name: Run tests
        run: dbt test
        working-directory: dbt_project/transactsafe
